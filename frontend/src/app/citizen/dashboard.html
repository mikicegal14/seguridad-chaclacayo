<div class="min-h-screen bg-bg-dark text-slate-100 flex flex-col font-sans relative overflow-hidden">
  <!-- Background Decorative Blobs -->
  <div class="absolute -top-40 -right-40 w-80 h-80 bg-primary opacity-5 rounded-full blur-3xl pointer-events-none" aria-hidden="true"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-secondary opacity-5 rounded-full blur-3xl pointer-events-none" aria-hidden="true"></div>

  <!-- Header -->
  <header class="bg-card-dark/70 backdrop-blur-md border-b border-border-dark px-4 sm:px-6 py-4 flex justify-between items-center z-10">
    <div class="flex items-center space-x-2">
      <div class="h-8 w-8 bg-gradient-to-tr from-primary to-secondary rounded-lg flex items-center justify-center shadow" aria-hidden="true">
        <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-bold tracking-tight bg-gradient-to-r from-secondary-pastel to-primary-pastel bg-clip-text text-transparent">Seguridad Vecinal</h1>
        <p class="text-[11px] text-slate-400">Chaclacayo Alerta</p>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <span class="text-xs font-semibold text-slate-300 hidden sm:inline">{{ authService.currentUser()?.nombre }}</span>
      <button 
        (click)="authService.logout()"
        aria-label="Cerrar sesión de ciudadano"
        class="min-h-[40px] px-3.5 py-1.5 text-xs font-semibold rounded-xl text-red-300 bg-red-500/10 border border-red-500/20 hover:bg-red-500/20 transition duration-200 cursor-pointer flex items-center gap-1"
      >
        <svg class="h-3.5 w-3.5" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        <span>Salir</span>
      </button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav role="tablist" aria-label="Modos del panel ciudadano" class="flex border-b border-border-dark bg-card-dark/30 z-10 w-full justify-around text-xs font-bold uppercase tracking-wider">
    <a 
      role="tab"
      routerLink="/citizen/panic"
      routerLinkActive="border-b-2 border-primary-pastel text-primary-pastel"
      class="flex-1 min-h-[44px] text-center text-slate-400 hover:text-slate-200 py-3.5 px-6 transition duration-200 focus:outline-none cursor-pointer flex items-center justify-center gap-2"
    >
      <span>🚨</span> Botón de Pánico
    </a>
    <a 
      role="tab"
      routerLink="/citizen/history"
      routerLinkActive="border-b-2 border-primary-pastel text-primary-pastel"
      class="flex-1 min-h-[44px] text-center text-slate-400 hover:text-slate-200 py-3.5 px-6 transition duration-200 focus:outline-none cursor-pointer flex items-center justify-center gap-2"
    >
      <span>📋</span> Mis Reportes
    </a>
  </nav>

  <!-- Main Content Container -->
  <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-6 z-10 max-w-md mx-auto w-full text-center">
    <router-outlet></router-outlet>
  </main>
  
  <!-- Footer -->
  <footer class="text-center py-4 text-[10px] text-slate-500 z-10 border-t border-border-dark/40 bg-card-dark/30">
    © 2026 Municipalidad de Chaclacayo · Dirección de Seguridad Ciudadana
  </footer>
</div>
