<main class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 bg-bg-dark relative overflow-hidden">
  <!-- Subtle Gradient Accent Glow -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary/10 rounded-full blur-3xl" aria-hidden="true"></div>

  <div class="max-w-md w-full space-y-8 p-8 bg-card-dark border border-border-dark rounded-2xl shadow-2xl relative z-10">
    <header class="text-center">
      <div class="mx-auto h-16 w-16 bg-gradient-to-tr from-primary to-primary-pastel rounded-2xl flex items-center justify-center shadow-lg border border-primary/20" aria-hidden="true">
        <svg class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <h1 class="mt-6 text-3xl font-extrabold text-white tracking-tight">Centro de Monitoreo</h1>
      <p class="mt-2 text-sm text-gray-400">
        Acceso Administrativo y Operadores
      </p>
    </header>

    @if (errorMessage()) {
      <div role="alert" class="bg-red-500/10 border border-red-500/20 text-red-200 text-sm p-4 rounded-lg flex items-center space-x-2">
        <svg class="h-5 w-5 text-red-400 shrink-0" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form class="mt-8 space-y-6" (submit)="onSubmit($event)">
      <div class="space-y-4">
        <div>
          <label for="admin-identifier" class="block text-sm font-medium text-gray-300">DNI o Contacto (Email / Teléfono)</label>
          <input
            id="admin-identifier"
            name="identifier"
            type="text"
            autocomplete="username"
            required
            [(ngModel)]="identifier"
            class="mt-1 block w-full px-4 py-3 bg-bg-dark border border-border-dark rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-pastel focus:border-transparent transition"
            placeholder="Ingrese su DNI o correo electrónico"
          />
        </div>

        <div>
          <label for="admin-password" class="block text-sm font-medium text-gray-300">Contraseña</label>
          <input
            id="admin-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            [(ngModel)]="password"
            class="mt-1 block w-full px-4 py-3 bg-bg-dark border border-border-dark rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-pastel focus:border-transparent transition"
            placeholder="••••••••"
          />
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="text-sm">
          <a routerLink="/auth/login" class="font-medium text-secondary-pastel hover:text-secondary transition py-1 inline-block">
            ¿Eres ciudadano? Ingresa aquí
          </a>
        </div>
      </div>

      <div>
        <button
          type="submit"
          [disabled]="isLoading()"
          class="group relative w-full min-h-[48px] flex items-center justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-primary hover:bg-primary-pastel focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg"
        >
          @if (isLoading()) {
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" aria-hidden="true" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Iniciando sesión de control...
          } @else {
            Ingresar al Sistema
          }
        </button>
      </div>
    </form>
  </div>
</main>
