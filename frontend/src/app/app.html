<router-outlet />
<h1 class="sr-only">Seguridad Chaclacayo</h1>

<!-- Global Toast Notification -->
@if (toastService.message()) {
  <aside 
    aria-live="polite" 
    aria-atomic="true"
    class="fixed bottom-6 right-6 z-50 animate-bounce transition duration-300"
  >
    <div 
      [class]="
        toastService.type() === 'success' 
          ? 'bg-card-dark border-green-500/40 text-green-300 shadow-green-950/40' 
          : 'bg-card-dark border-red-500/40 text-red-300 shadow-red-950/40'
      "
      class="border shadow-2xl px-5 py-3.5 rounded-2xl flex items-center gap-3 max-w-md text-xs font-semibold backdrop-blur-md"
    >
      @if (toastService.type() === 'success') {
        <svg class="h-5 w-5 text-green-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      } @else {
        <svg class="h-5 w-5 text-red-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      }
      <span class="flex-1 leading-relaxed">{{ toastService.message() }}</span>
      <button 
        type="button" 
        (click)="toastService.clear()" 
        aria-label="Cerrar notificación" 
        class="ml-2 text-slate-400 hover:text-slate-100 transition cursor-pointer p-1 rounded-lg hover:bg-white/10 shrink-0"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </aside>
}
