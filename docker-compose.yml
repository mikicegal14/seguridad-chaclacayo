version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seguridad_chaclacayo_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: security_password_2026
      POSTGRES_DB: seguridad_chaclacayo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
